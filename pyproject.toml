[project]
name = "llm-text-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.66.1",
]
[tool.uv]
package = false
dependencies = [
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-text-analyzer = "llm_text_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
